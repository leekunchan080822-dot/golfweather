name: Generate HeyGen Video

on:
  workflow_dispatch:
    inputs:
      script_text:
        description: Text script for HeyGen
        required: true
        default: Please enter the script you want to convert to a video.
      title:
        description: Output title (optional)
        required: false
        default: heygen-autocreated
      avatar_id:
        description: Override avatar look id (optional)
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare and validate inputs
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          SECRET_AVATAR_ID: ${{ secrets.HEYGEN_AVATAR_ID }}
          INPUT_AVATAR_ID: ${{ github.event.inputs.avatar_id }}
        run: |
          ACTIVE_AVATAR_ID="$(printf '%s' "${INPUT_AVATAR_ID:-$SECRET_AVATAR_ID}" | tr -d '[:space:]')"
          if [ -z "$ACTIVE_AVATAR_ID" ]; then
            echo "Missing avatar id: set secrets.HEYGEN_AVATAR_ID or workflow input avatar_id."
            exit 1
          fi
          echo "USE_AVATAR_ID=$ACTIVE_AVATAR_ID" >> "$GITHUB_ENV"

          HTTP_STATUS=$(curl -sS "https://api.heygen.com/v3/avatars/looks?ownership=private" \
            -H "x-api-key: ${HEYGEN_API_KEY}" \
            -o /tmp/private_looks.json \
            -w "%{http_code}")

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "Precheck failed to list private avatar looks: HTTP ${HTTP_STATUS}"
            jq -r '.error // .message // "No structured error payload"' /tmp/private_looks.json || true
            exit 1
          fi

          HTTP_STATUS=$(curl -sS "https://api.heygen.com/v3/avatars/looks" \
            -H "x-api-key: ${HEYGEN_API_KEY}" \
            -o /tmp/all_looks.json \
            -w "%{http_code}")

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "Precheck failed to list avatar looks: HTTP ${HTTP_STATUS}"
            jq -r '.error // .message // "No structured error payload"' /tmp/all_looks.json || true
            exit 1
          fi

          MATCH_COUNT=$(jq -r --arg id "$ACTIVE_AVATAR_ID" '[.data[] | select(.id==$id)] | length' /tmp/all_looks.json)
          if [ "$MATCH_COUNT" = "0" ]; then
            echo "avatar_not_found: The avatar_id in use is not in your available avatar looks."
            echo "Active avatar_id: $ACTIVE_AVATAR_ID"
            echo "--- Available avatar looks (first 20) ---"
            jq -r '.data[:20][] | "\(.id) \t \(.name)\t\(.avatar_type // .type // "")\t\(.status // \"\")"' /tmp/all_looks.json
            exit 1
          fi
          echo "Selected avatar look found in available looks."
          jq -r --arg id "$ACTIVE_AVATAR_ID" '.data[] | select(.id==$id) | "selected_look: \(.name) | type=\(.avatar_type // .type // \"\") | engines=\(.supported_api_engines // \"\")"' /tmp/all_looks.json

      - name: Validate required secrets
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_VOICE_ID: ${{ secrets.HEYGEN_VOICE_ID }}
        run: |
          if [ -z "${HEYGEN_API_KEY}" ] || [ -z "${HEYGEN_VOICE_ID}" ]; then
            echo "Set HEYGEN_API_KEY and HEYGEN_VOICE_ID in Repo > Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Create HeyGen video (v3/videos)
        id: create
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_VOICE_ID: ${{ secrets.HEYGEN_VOICE_ID }}
          HEYGEN_AVATAR_ID: ${{ env.USE_AVATAR_ID }}
          SCRIPT_TEXT: ${{ github.event.inputs.script_text }}
          VIDEO_TITLE: ${{ github.event.inputs.title }}
        run: |
          VIDEO_TITLE="${VIDEO_TITLE:-heygen-autocreated}"
          jq -n \
            --arg type "avatar" \
            --arg avatar_id "${HEYGEN_AVATAR_ID}" \
            --arg script "${SCRIPT_TEXT}" \
            --arg voice_id "${HEYGEN_VOICE_ID}" \
            --arg title "${VIDEO_TITLE}" \
            '{type:$type, avatar_id:$avatar_id, script:$script, voice_id:$voice_id, title:$title, resolution:"1080p", aspect_ratio:"16:9"}' \
            > /tmp/payload.json
          echo "Create payload:"
          cat /tmp/payload.json

          HTTP_STATUS=$(curl -sS -X POST "https://api.heygen.com/v3/videos" \
            -H "x-api-key: ${HEYGEN_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json \
            -o /tmp/create_response.json \
            -w "%{http_code}")

          echo "HeyGen create response:"
          cat /tmp/create_response.json

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "Create video failed with HTTP ${HTTP_STATUS}"
            jq -r '.error // .message // .data.error // "No structured error payload"' /tmp/create_response.json
            exit 1
          fi

          JOB_ID=$(jq -r '.data.video_id // .data.id // empty' /tmp/create_response.json || true)
          if [ -z "${JOB_ID}" ] || [ "${JOB_ID}" = "null" ]; then
            echo "No video_id returned. Full payload:"
            cat /tmp/create_response.json
            exit 1
          fi

          echo "video_id=${JOB_ID}" >> "$GITHUB_OUTPUT"
          echo "Created video_id=${JOB_ID}"

      - name: Poll HeyGen status (v3/videos/{video_id})
        id: poll
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          VIDEO_ID="${{ steps.create.outputs.video_id }}"
          for i in $(seq 1 30); do
            HTTP_STATUS=$(curl -sS "https://api.heygen.com/v3/videos/${VIDEO_ID}" \
              -H "x-api-key: ${HEYGEN_API_KEY}" \
              -o /tmp/status.json \
              -w "%{http_code}")

            echo "Status response (attempt ${i}):"
            cat /tmp/status.json

            if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
              echo "Get status failed with HTTP ${HTTP_STATUS}"
              jq -r '.error // .message // .data.error // "No structured error payload"' /tmp/status.json
              exit 1
            fi

            STATUS=$(jq -r '.data.status // .status // "unknown"' /tmp/status.json || true)
            if [ "${STATUS}" = "completed" ]; then
              VIDEO_URL=$(jq -r '.data.video_url // empty' /tmp/status.json || true)
              if [ -z "${VIDEO_URL}" ] || [ "${VIDEO_URL}" = "null" ]; then
                echo "Status is completed but video_url is missing"
                exit 1
              fi
              echo "video_url=${VIDEO_URL}" >> "$GITHUB_OUTPUT"
              echo "Video is ready: ${VIDEO_URL}"
              break
            fi

            if [ "${STATUS}" = "failed" ]; then
              echo "Video generation failed"
              jq -r '.data.failure_message // .data.failure_code // .message // "No failure message"' /tmp/status.json
              exit 1
            fi

            echo "Video status: ${STATUS}, retry in 10 seconds..."
            sleep 10
          done
          echo "Polling timeout after 30 attempts without completion."
          exit 1

      - name: Download and upload result
        id: download
        run: |
          VIDEO_URL="${{ steps.poll.outputs.video_url }}"
          mkdir -p dist
          if [ -z "${VIDEO_URL}" ] || [ "${VIDEO_URL}" = "null" ]; then
            echo "Video URL not found after polling."
            exit 1
          fi
          FILENAME="${{ github.event.inputs.title }}.mp4"
          curl -L "${VIDEO_URL}" -o "dist/${FILENAME}"
          ls -lh dist
          echo "output_file=dist/${FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: heygen-video
          path: dist/
