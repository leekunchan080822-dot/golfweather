name: List HeyGen Avatar Looks

on:
  workflow_dispatch:

jobs:
  list_assets:
    runs-on: ubuntu-latest
    steps:
      - name: List avatar looks (v3)
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          HTTP_STATUS=$(curl -sS "https://api.heygen.com/v3/avatars/looks?ownership=private" \
            -H "x-api-key: ${HEYGEN_API_KEY}" \
            -o /tmp/looks.json \
            -w "%{http_code}")

          echo "HeyGen API response:"
          cat /tmp/looks.json

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "List avatar looks failed with HTTP ${HTTP_STATUS}"
            jq -r '.error // .message // "No structured error payload"' /tmp/looks.json
            exit 1
          fi

          echo "Parsed Avatar Looks (id, name, status):"
          jq -r '.data[]? | "\(.id)  \(.name)  \(.status)"' /tmp/looks.json
          COUNT=$(jq -r '.data | length' /tmp/looks.json)
          echo "Total count: ${COUNT}"
